<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAR — Generate password hash</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:60px auto;padding:0 20px;color:#141414;}
  h1{font-size:20px;}
  input{width:100%;padding:12px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin:12px 0;}
  button{padding:12px 20px;font-size:15px;border:none;border-radius:8px;background:#141414;color:#fff;cursor:pointer;}
  textarea{width:100%;height:90px;margin-top:16px;padding:10px;font-family:monospace;font-size:13px;}
  p{color:#555;font-size:14px;line-height:1.6;}
</style>
</head>
<body>
  <h1>SAAR — Generate a password hash</h1>
  <p>
    This page runs only in your browser — nothing is sent anywhere.
    Type a new password below, copy the hash it produces, and paste it
    into <code>js/config.js</code> as <code>PASSWORD_HASH</code>.
  </p>
  <input type="text" id="pw" placeholder="Type new password">
  <button id="go">Generate hash</button>
  <textarea id="out" readonly placeholder="Hash will appear here..."></textarea>

  <script>
    async function sha256(text) {
      var enc = new TextEncoder().encode(text);
      var buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf))
        .map(function (b) { return b.toString(16).padStart(2, "0"); })
        .join("");
    }
    document.getElementById("go").addEventListener("click", async function () {
      var pw = document.getElementById("pw").value;
      if (!pw) return;
      var hash = await sha256(pw);
      document.getElementById("out").value =
        'PASSWORD_HASH: "' + hash + '"\n\n(Password was: ' + pw + ')';
    });
  </script>
</body>
</html>
